- id: generated_c5bad16ee469
  question: According to the 2022 WHO guidance on noncommunicable disease facility-based
    monitoring, how is the indicator 'Facilities receiving supervisory visit' calculated
    and what is its primary purpose?
  answerable: true
  reference_answer: According to the 2022 WHO guidance, the indicator 'Facilities
    receiving supervisory visit' is designed to ensure continuous quality improvement
    of clinical care and data. It is calculated by dividing the number of health facilities
    receiving a supervisory visit in the last reporting period by the total number
    of health facilities, and then multiplying the result by 100.
  required_topics:
  - Facilities receiving supervisory visit
  - Purpose
  - Method of calculation
