  question: According to the 2024 WHO guidance on global monitoring for diabetes,
    under what specific condition is the health tax indicator evaluated as 'Partially
    yes'?
  answerable: true
  reference_answer: The indicator is evaluated as 'Partially yes' if the country has
    adopted health taxes on at least one type of the specified products (such as alcoholic
